# A execução exige variáveis de ambiente configuradas localmente, não salve senhas no Git.
spring.application.name=pedi-fruki-api
server.port=${PORT:8080}

# PostgreSQL Supabase. JDBC URL exemplo: jdbc:postgresql://host:5432/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# As sete tabelas já existem: JPA não deve executar migrações nem alterá-las.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never

# Frontend executado com Live Server (5500) ou Vite (5173).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173}

# Regras comerciais. Descontos e promoções fora do escopo.
app.pedidos.quantidade-minima=${PEDIDO_QUANTIDADE_MINIMA:200}
app.estoque.baixar-no-pedido=${BAIXAR_ESTOQUE_NO_PEDIDO:false}
app.estoque.exigir-registro=${EXIGIR_REGISTRO_ESTOQUE:false}
app.recomendacoes.contexto-cache-segundos=${CONTEXTO_CACHE_SEGUNDOS:1800}
app.recomendacoes.palavras-bebidas=${PALAVRAS_BEBIDAS:agua,refri,refrigerante,suco,energetico,cha,guarana,citrus}

# E-mail após commit. Desativado por padrão.
app.email.resend.enabled=${RESEND_ENABLED:false}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${RESEND_FROM_EMAIL:}
app.email.resend.to=${RESEND_TO_EMAIL:}
app.email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
